<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Galeria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0c0b; --bg2:#171513; --card:#1f1c19; --ink:#f3ede4; --mute:#a59c90; --line:#2c2824;
  --accent:#e8b86b; --accent-ink:#1a1408; --err:#ff8a7a;
  --r:14px; --gut:clamp(16px,3vw,48px);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font:400 clamp(15px,1.05vw,22px)/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.f:focus{outline:none}
.f:focus-visible,.f.kf{outline:3px solid var(--accent);outline-offset:4px}
.hidden{display:none!important}
h1,h2{font-family:Fraunces,Georgia,serif;font-weight:300;letter-spacing:-.01em}

/* ---------- senha ---------- */
#lock{min-height:100%;display:grid;place-items:center;padding:var(--gut);
  background:radial-gradient(1200px 600px at 70% -10%,#3a2a14 0,transparent 60%),var(--bg)}
#lock form{width:min(460px,100%);text-align:center}
#lock h1{font-size:clamp(40px,5vw,84px);margin-bottom:.15em}
#lock p{color:var(--mute);margin-bottom:2em}
#pw{width:100%;padding:.85em 1em;border-radius:var(--r);border:1px solid var(--line);background:var(--bg2);color:var(--ink);font:inherit;font-size:1.2em;text-align:center;letter-spacing:.2em}
#pw:focus{outline:3px solid var(--accent);outline-offset:3px}
.row{display:flex;gap:.6em;align-items:center;justify-content:center;margin:1.1em 0;color:var(--mute)}
.row input{width:1.2em;height:1.2em;accent-color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:.5em;padding:.8em 1.6em;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:var(--card);color:var(--ink)}
#lockmsg{min-height:1.5em;margin-top:1em;color:var(--mute)}
#lockmsg.err{color:var(--err)}

/* ---------- home ---------- */
#home{min-height:100%;padding:var(--gut);display:flex;flex-direction:column;gap:clamp(20px,3vw,48px)}
header.top{display:flex;align-items:end;justify-content:space-between;gap:1em;flex-wrap:wrap}
header.top h1{font-size:clamp(34px,4.2vw,76px);line-height:1}
header.top .sub{color:var(--mute)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:clamp(14px,2vw,32px)}
.mode{position:relative;aspect-ratio:16/10;border-radius:calc(var(--r)*1.4);overflow:hidden;text-align:left;background:var(--card);isolation:isolate;transition:transform .25s}
.mode:focus-visible,.mode.kf{transform:scale(1.03)}
.mode .bg{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:2px;z-index:-2;opacity:.75}
.mode .bg img{width:100%;height:100%;object-fit:cover}
.mode::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.85))}
.mode .lbl{position:absolute;left:1.1em;right:1.1em;bottom:1em}
.mode .lbl b{display:block;font:300 clamp(26px,2.6vw,52px)/1.05 Fraunces,Georgia,serif}
.mode .lbl span{color:#d8cfc2}
.opts{display:flex;gap:.6em;flex-wrap:wrap;align-items:center;color:var(--mute)}
.chip{padding:.55em 1.1em;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ---------- galeria ---------- */
#grid{padding:0 0 var(--gut)}
.month{margin-top:clamp(20px,2.5vw,40px)}
.month h2{position:sticky;top:0;z-index:2;padding:.5em 0;font-size:clamp(22px,2vw,38px);background:linear-gradient(var(--bg) 70%,transparent)}
.month h2 small{font:400 .5em Inter,sans-serif;color:var(--mute);margin-left:.6em}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(110px,12vw,220px),1fr));gap:4px}
.tile{position:relative;aspect-ratio:1;background:var(--card);overflow:hidden;border-radius:4px}
.tile img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.tile img.on{opacity:1}
.tile .dur{position:absolute;right:6px;bottom:6px;padding:2px 7px;border-radius:6px;background:rgba(0,0,0,.6);font-size:.8em;font-weight:600}
.tile:focus-visible,.tile.kf{outline-offset:-3px;z-index:1}

/* ---------- player ---------- */
#player{position:fixed;inset:0;background:#000;z-index:10;display:grid;place-items:center;cursor:none}
#player.hud-on{cursor:default}
#stage{position:absolute;inset:0}
#stage>*{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity 1.1s ease}
#stage>.on{opacity:1}
#stage img.kb{animation:kb 9s ease-out both}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.05)}}
.hud{position:absolute;left:0;right:0;padding:clamp(16px,2.5vw,40px);display:flex;justify-content:space-between;align-items:center;gap:1em;opacity:0;transition:opacity .4s;pointer-events:none;
  font-size:clamp(15px,1.3vw,26px)}
#player.hud-on .hud{opacity:1;pointer-events:auto}
.hud.t{top:0;background:linear-gradient(rgba(0,0,0,.7),transparent)}
.hud.b{bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.hud .date{font:300 1.6em Fraunces,Georgia,serif}
.hud .ctr{color:#cfc6ba}
.hud .ctl{display:flex;gap:.5em}
.hud .ctl button{width:2.6em;height:2.6em;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center}
.hud .ctl svg{width:1.1em;height:1.1em;fill:currentColor}
#spin{position:absolute;width:48px;height:48px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--accent);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(1turn)}}
.bar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);width:0}
.toast{position:fixed;left:50%;top:12%;transform:translateX(-50%);padding:.6em 1.2em;border-radius:999px;background:rgba(20,18,16,.85);z-index:20;font-weight:500;transition:opacity .3s}
@media (prefers-reduced-motion:reduce){#stage img.kb{animation:none}#stage>*{transition:none}}
</style>
</head>
<body>

<section id="lock">
  <form id="lockform" autocomplete="off">
    <h1>Galeria</h1>
    <p>Fotos e vídeos protegidos. Digite a senha.</p>
    <input id="pw" class="f" type="password" inputmode="text" aria-label="Senha" autofocus>
    <label class="row"><input id="remember" type="checkbox" checked> Lembrar neste aparelho</label>
    <button class="btn f" type="submit">Entrar</button>
    <div id="lockmsg" role="status"></div>
  </form>
</section>

<section id="home" class="hidden">
  <header class="top">
    <div><h1>Galeria</h1><div class="sub" id="stats"></div></div>
    <button class="btn ghost f" id="logout">Sair</button>
  </header>
  <div class="modes">
    <button class="mode f" data-mode="photos"><div class="bg"></div><div class="lbl"><b>Sequência de fotos</b><span id="np"></span></div></button>
    <button class="mode f" data-mode="videos"><div class="bg"></div><div class="lbl"><b>Sequência de vídeos</b><span id="nv"></span></div></button>
    <button class="mode f" data-mode="grid"><div class="bg"></div><div class="lbl"><b>Galeria</b><span>Navegar por mês</span></div></button>
  </div>
  <div class="opts" role="group" aria-label="Ordem">
    <span>Ordem:</span>
    <button class="chip f" data-order="old" aria-pressed="true">Mais antigas primeiro</button>
    <button class="chip f" data-order="new" aria-pressed="false">Mais recentes primeiro</button>
    <button class="chip f" data-order="rand" aria-pressed="false">Aleatória</button>
    <span style="margin-left:1em">Foto a cada:</span>
    <button class="chip f" data-sec="5" aria-pressed="false">5 s</button>
    <button class="chip f" data-sec="8" aria-pressed="true">8 s</button>
    <button class="chip f" data-sec="15" aria-pressed="false">15 s</button>
  </div>
  <div id="grid" class="hidden"></div>
</section>

<section id="player" class="hidden" aria-label="Reprodutor" tabindex="-1">
  <div id="stage"></div>
  <div id="spin" class="hidden"></div>
  <div class="hud t"><div><div class="date" id="pdate"></div><div class="ctr" id="pctr"></div></div>
    <div class="ctl"><button class="f" id="bclose" aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7l1.4-1.4 6.3 6.3 6.3-6.3z"/></svg></button></div></div>
  <div class="hud b"><div class="ctr" id="phint">← → navegar · OK pausar · Voltar sair</div>
    <div class="ctl">
      <button class="f" id="bprev" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
      <button class="f" id="bplay" aria-label="Pausar"><svg viewBox="0 0 24 24"><path id="playico" d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg></button>
      <button class="f" id="bnext" aria-label="Próxima"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
    </div></div>
  <div class="bar" id="bar"></div>
</section>

<script>
"use strict";
const MEDIA = "https://d212z35lp14c1p.cloudfront.net/m/";
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const store = { get(k){try{return localStorage.getItem(k)}catch{return null}}, set(k,v){try{localStorage.setItem(k,v)}catch{}}, del(k){try{localStorage.removeItem(k)}catch{}} };
let KEY, ITEMS = [], order = store.get("order") || "old", secs = +(store.get("secs") || 8);

/* ---------- cripto ---------- */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pass){
  const c = await (await fetch("crypto.json")).json();
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(c.salt), iterations:c.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, true, ["decrypt"]);
}
async function decrypt(buf){
  const u = new Uint8Array(buf);
  return crypto.subtle.decrypt({name:"AES-GCM", iv:u.subarray(0,12)}, KEY, u.subarray(12));
}
async function fetchDec(url, type, signal){
  const r = await fetch(url, {signal});
  if(!r.ok) throw new Error(r.status);
  return URL.createObjectURL(new Blob([await decrypt(await r.arrayBuffer())], {type}));
}

/* ---------- entrar ---------- */
async function unlock(key){
  KEY = key;
  ITEMS = JSON.parse(new TextDecoder().decode(await decrypt(await (await fetch("manifest.enc")).arrayBuffer())));
}
$("#lockform").onsubmit = async e => {
  e.preventDefault();
  const msg = $("#lockmsg"); msg.className = ""; msg.textContent = "Abrindo…";
  try{
    const k = await deriveKey($("#pw").value);
    await unlock(k);
    if($("#remember").checked){
      const raw = await crypto.subtle.exportKey("raw", k);
      store.set("gk", btoa(String.fromCharCode(...new Uint8Array(raw))));
    }
    showHome();
  }catch(err){ msg.className = "err"; msg.textContent = "Senha incorreta."; $("#pw").select(); }
};
$("#logout").onclick = () => { store.del("gk"); location.reload(); };
(async () => {
  const saved = store.get("gk");
  if(!saved) return;
  try{ await unlock(await crypto.subtle.importKey("raw", b64(saved), "AES-GCM", false, ["decrypt"])); showHome(); }
  catch{ store.del("gk"); }
})();

/* ---------- home ---------- */
const photos = () => ITEMS.filter(i => i.t === "p"), videos = () => ITEMS.filter(i => i.t === "v");
const fmtDate = d => d ? new Date(d).toLocaleDateString("pt-BR", {day:"numeric", month:"long", year:"numeric"}) : "";
const fmtDur = s => `${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,"0")}`;
function showHome(){
  $("#lock").classList.add("hidden"); $("#home").classList.remove("hidden");
  const p = photos().length, v = videos().length, ds = ITEMS.map(i => i.d).filter(Boolean).sort();
  $("#np").textContent = `${p} fotos`; $("#nv").textContent = `${v} vídeos`;
  $("#stats").textContent = ds.length ? `${ITEMS.length} itens · ${new Date(ds[0]).getFullYear()}–${new Date(ds.at(-1)).getFullYear()}` : `${ITEMS.length} itens`;
  syncChips();
  // capas: 6 miniaturas aleatórias por cartão
  const pick = (arr, n) => arr.slice().sort(() => Math.random() - .5).slice(0, n);
  [["photos", photos()], ["videos", videos()], ["grid", ITEMS]].forEach(([m, arr]) =>
    pick(arr, 6).forEach(async it => { const img = new Image(); $(`.mode[data-mode=${m}] .bg`).append(img); img.src = await thumb(it); }));
  focusFirst();
}
function syncChips(){
  $$("[data-order]").forEach(b => b.setAttribute("aria-pressed", b.dataset.order === order));
  $$("[data-sec]").forEach(b => b.setAttribute("aria-pressed", +b.dataset.sec === secs));
}
$$("[data-order]").forEach(b => b.onclick = () => { order = b.dataset.order; store.set("order", order); syncChips(); });
$$("[data-sec]").forEach(b => b.onclick = () => { secs = +b.dataset.sec; store.set("secs", secs); syncChips(); });
function ordered(list){
  const l = list.slice().sort((a, b) => (a.d || "").localeCompare(b.d || ""));
  if(order === "new") l.reverse();
  if(order === "rand") for(let i = l.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [l[i], l[j]] = [l[j], l[i]]; }
  return l;
}
$$(".mode").forEach(b => b.onclick = () => {
  const m = b.dataset.mode; b.focus();
  if(m === "grid") return showGrid();
  play(ordered(m === "photos" ? photos() : videos()), 0, true);
});

/* ---------- miniaturas (fila com limite) ---------- */
const tcache = new Map(); let active = 0; const queue = [];
function thumb(it){
  if(tcache.has(it.id)) return tcache.get(it.id);
  const p = new Promise(res => queue.push(() => fetchDec("t/" + it.id, "image/jpeg").then(res, () => res(""))));
  tcache.set(it.id, p); pump(); return p;
}
function pump(){
  while(active < 6 && queue.length){ active++; queue.shift()().finally(() => { active--; pump(); }); }
}

/* ---------- galeria ---------- */
let gridBuilt = false;
function showGrid(){
  const g = $("#grid"); g.classList.remove("hidden");
  if(!gridBuilt){
    gridBuilt = true;
    const list = ITEMS.slice().sort((a, b) => (b.d || "").localeCompare(a.d || ""));
    const months = new Map();
    list.forEach(it => { const k = (it.d || "0000-00").slice(0, 7); (months.get(k) || months.set(k, []).get(k)).push(it); });
    const io = new IntersectionObserver(es => es.forEach(async e => {
      if(!e.isIntersecting) return; io.unobserve(e.target);
      const img = e.target.querySelector("img"); img.src = await thumb(list[+e.target.dataset.i]); img.onload = () => img.classList.add("on");
    }), {rootMargin: "800px"});
    let i = 0;
    for(const [k, arr] of months){
      const sec = document.createElement("div"); sec.className = "month";
      const title = k === "0000-00" ? "Sem data" : new Date(k + "-15").toLocaleDateString("pt-BR", {month:"long", year:"numeric"});
      sec.innerHTML = `<h2>${title}<small>${arr.length}</small></h2><div class="tiles"></div>`;
      const tiles = sec.querySelector(".tiles");
      arr.forEach(it => {
        const b = document.createElement("button"); b.className = "tile f"; b.dataset.i = i++;
        b.setAttribute("aria-label", `${it.t === "v" ? "Vídeo" : "Foto"} ${fmtDate(it.d)}`);
        b.innerHTML = `<img alt="">${it.t === "v" ? `<span class="dur">▶ ${fmtDur(it.dur)}</span>` : ""}`;
        b.onclick = () => play(list, +b.dataset.i, false);
        tiles.append(b); io.observe(b);
      });
      g.append(sec);
    }
  }
  g.scrollIntoView({behavior: "smooth"});
  setTimeout(() => g.querySelector(".tile")?.focus(), 400);
}

/* ---------- player ---------- */
const P = { gen: 0, list: [], i: 0, auto: true, paused: false, timer: 0, ctrl: null, hudT: 0, cache: new Map(), back: null };
function load(it){
  if(P.cache.has(it.id)) return P.cache.get(it.id);
  const p = fetchDec(MEDIA + it.id, it.t === "v" ? "video/mp4" : "image/jpeg");
  P.cache.set(it.id, p); return p;
}
function trimCache(){
  const keep = new Set([-1, 0, 1, 2].map(o => P.list[(P.i + o + P.list.length) % P.list.length]?.id));
  for(const [id, p] of P.cache) if(!keep.has(id)){ p.then(u => URL.revokeObjectURL(u), () => {}); P.cache.delete(id); }
}
function play(list, i, auto){
  if(!list.length) return;
  P.back = document.activeElement; P.list = list; P.i = i; P.auto = auto; P.paused = false;
  $("#player").classList.remove("hidden"); $("#player").focus();
  document.documentElement.requestFullscreen?.().catch(() => {});
  show(); hud();
}
function killMedia(el){ if(el.tagName === "VIDEO"){ el.onended = el.onerror = null; el.pause(); el.removeAttribute("src"); el.load(); } el.remove(); }
function close(){
  clearTimeout(P.timer); P.gen++; [...$("#stage").children].forEach(killMedia);
  for(const p of P.cache.values()) p.then(u => URL.revokeObjectURL(u), () => {});
  P.cache.clear(); $("#player").classList.add("hidden");
  if(document.fullscreenElement) document.exitFullscreen?.();
  const b = P.back;
  (b?.matches?.(".f") && b.offsetParent ? b : $(".mode"))?.focus();
}
async function show(){
  if($("#player").classList.contains("hidden")) return;
  clearTimeout(P.timer); $("#bar").style.transition = "none"; $("#bar").style.width = "0";
  const it = P.list[P.i], n = P.i, g = ++P.gen;
  $("#pdate").textContent = fmtDate(it.d); $("#pctr").textContent = `${P.i + 1} de ${P.list.length}`;
  $("#spin").classList.remove("hidden");
  let url; try{ url = await load(it); }catch{ url = null; }
  if(g !== P.gen || n !== P.i) return; // usuário já avançou ou fechou
  $("#spin").classList.add("hidden");
  const stage = $("#stage"), old = [...stage.children];
  let el;
  if(!url){ el = document.createElement("div"); }
  else if(it.t === "v"){
    el = document.createElement("video"); el.src = url; el.playsInline = true; el.autoplay = true; el.controls = !P.auto;
    el.onended = () => { if(P.auto && g === P.gen) step(1); };
    el.onerror = () => { if(P.auto && g === P.gen) step(1); };
  } else {
    el = document.createElement("img"); el.src = url; el.alt = ""; if(P.auto) el.className = "kb";
  }
  stage.append(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("on")));
  old.forEach(o => { if(o.tagName === "VIDEO"){ o.onended = o.onerror = null; o.pause(); } }); setTimeout(() => old.forEach(killMedia), 1200);
  if(it.t === "v" && P.paused) el.autoplay = false;
  if(P.auto && !P.paused && (it.t === "p" || !url)) timerStart();
  // pré-carrega as próximas
  [1, 2].forEach(o => { const nx = P.list[(P.i + o) % P.list.length]; if(nx) load(nx).catch(() => {}); });
  trimCache();
}
function timerStart(){
  clearTimeout(P.timer); const g = P.gen;
  const bar = $("#bar");
  requestAnimationFrame(() => { bar.style.transition = `width ${secs}s linear`; bar.style.width = "100%"; });
  P.timer = setTimeout(() => { if(g === P.gen && !P.paused) step(1); }, secs * 1000);
}
function step(d){ P.i = (P.i + d + P.list.length) % P.list.length; show(); }
function togglePause(){
  P.paused = !P.paused;
  $("#playico").setAttribute("d", P.paused ? "M8 5v14l11-7z" : "M6 5h4v14H6zm8 0h4v14h-4z");
  const v = $("#stage video.on"), it = P.list[P.i];
  if(v){ P.paused ? v.pause() : v.play(); }
  if(it.t === "p" && P.auto){
    if(P.paused){ clearTimeout(P.timer); const bar = $("#bar"); bar.style.width = getComputedStyle(bar).width; bar.style.transition = "none"; }
    else { $("#bar").style.transition = "none"; $("#bar").style.width = "0"; timerStart(); }
  }
  toast(P.paused ? "Pausado" : "Continuando"); hud();
}
function hud(){
  $("#player").classList.add("hud-on"); clearTimeout(P.hudT);
  P.hudT = setTimeout(() => $("#player").classList.remove("hud-on"), 3500);
}
let toastT;
function toast(t){
  let el = $(".toast"); if(!el){ el = document.createElement("div"); el.className = "toast"; document.body.append(el); }
  el.textContent = t; el.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => el.style.opacity = 0, 1200);
}
$("#bprev").onclick = () => { step(-1); hud(); };
$("#bnext").onclick = () => { step(1); hud(); };
$("#bplay").onclick = togglePause;
$("#bclose").onclick = close;
$("#player").addEventListener("mousemove", hud);
$("#stage").addEventListener("click", () => P.auto ? togglePause() : hud());

/* ---------- controle remoto / teclado ---------- */
// Voltar: Escape, Backspace, Tizen 10009, webOS 461, Android TV 4/"GoBack"
const isBack = e => ["Escape", "Backspace", "GoBack", "BrowserBack"].includes(e.key) || [10009, 461, 4].includes(e.keyCode);
const DIRS = {ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1]};
function focusFirst(){ setTimeout(() => $(".mode")?.focus(), 50); }
function spatial(dx, dy){
  const cur = document.activeElement, all = $$(".f").filter(el => el.offsetParent && !el.closest(".hidden"));
  if(!cur || !all.includes(cur)){ ($(".mode") || all[0])?.focus(); return; }
  const a = cur.getBoundingClientRect(), ax = a.left + a.width / 2, ay = a.top + a.height / 2;
  let best, bd = Infinity;
  for(const el of all){
    if(el === cur) continue;
    const b = el.getBoundingClientRect(), bx = b.left + b.width / 2, by = b.top + b.height / 2;
    const px = (bx - ax) * dx + (by - ay) * dy;          // avanço na direção
    if(px <= 4) continue;
    const off = Math.abs(dx ? by - ay : bx - ax);        // desvio lateral
    const d = px + off * 2.5;
    if(d < bd){ bd = d; best = el; }
  }
  if(best){ best.focus(); best.scrollIntoView({block: "nearest", behavior: "smooth"}); }
}
document.addEventListener("keydown", e => {
  if(!$("#player").classList.contains("hidden")){
    hud();
    if(isBack(e)){ e.preventDefault(); return close(); }
    if(e.key === "ArrowRight" || e.key === "MediaTrackNext"){ e.preventDefault(); return step(1); }
    if(e.key === "ArrowLeft" || e.key === "MediaTrackPrevious"){ e.preventDefault(); return step(-1); }
    if(["Enter", " ", "MediaPlayPause", "MediaPlay", "MediaPause"].includes(e.key) || [415, 19, 10252].includes(e.keyCode)){
      if(document.activeElement?.closest?.(".hud") && e.key === "Enter") return; // botão focado recebe o OK
      e.preventDefault(); return togglePause();
    }
    return;
  }
  if(e.target === $("#pw")) return;
  if(isBack(e) && !$("#grid").classList.contains("hidden")){ e.preventDefault(); $("#grid").classList.add("hidden"); window.scrollTo({top: 0}); return focusFirst(); }
  if(DIRS[e.key]){ e.preventDefault(); spatial(...DIRS[e.key]); }
});
</script>
